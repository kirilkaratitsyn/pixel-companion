name: Build and check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/CoreChecks
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/app.js
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish apps/windows/PixelCompanion.csproj -c Release -r win-x64 --self-contained true -o dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: PixelCompanion-Windows
          path: dist/windows
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed prototype APK
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0'
          ./scripts/build-android.ps1 -Jdk $env:JAVA_HOME -BuildTools "$env:ANDROID_HOME/build-tools/35.0.0" -AndroidJar "$env:ANDROID_HOME/platforms/android-35/android.jar" -WorkDirectory "$env:RUNNER_TEMP/android-build" -Output './dist/PixelCompanion.apk' -Keystore "$env:RUNNER_TEMP/prototype.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: PixelCompanion-Android
          path: dist/PixelCompanion.apk
